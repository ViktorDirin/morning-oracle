<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <linearGradient id="magentaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#222222" stroke-width="4" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyanGlow)" stroke-width="8" stroke-dasharray="6 14" opacity="0.6" />

  <!-- Inner Glowing Clock Rim -->
  <circle cx="256" cy="256" r="140" fill="#0d0d0d" stroke="url(#cyanGlow)" stroke-width="12" filter="url(#glow)" />

  <!-- Clock Hour Ticks -->
  <line x1="256" y1="130" x2="256" y2="148" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />
  <line x1="382" y1="256" x2="364" y2="256" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="382" x2="256" y2="364" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />
  <line x1="130" y1="256" x2="148" y2="256" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />

  <!-- Clock Hands (Pointing to 7:30 - wake up time) -->
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="185" y2="305" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="256" y2="345" stroke="url(#cyanGlow)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <!-- Center Pin with Magenta Accent -->
  <circle cx="256" cy="256" r="14" fill="#0a0a0a" stroke="url(#magentaGlow)" stroke-width="6" />

  <!-- Morning Sun / Star Sparkle at Top Right -->
  <path d="M 370 120 L 378 140 L 398 148 L 378 156 L 370 176 L 362 156 L 342 148 L 362 140 Z" fill="#00E5FF" filter="url(#glow)" />
</svg>
